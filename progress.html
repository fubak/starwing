<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>STARWING — build progress</title>
<style>
  body{margin:0;background:#070a14;color:#e8ecff;font-family:system-ui,sans-serif}
  header{padding:20px 28px;border-bottom:1px solid #1d2540;display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:22px;letter-spacing:.25em}
  .meta{opacity:.7;font-size:14px}
  main{padding:20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .card{background:#0e1326;border:1px solid #1d2540;border-radius:10px;overflow:hidden}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .card .b{padding:12px 14px}
  .card h2{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .st{font-size:11px;padding:2px 8px;border-radius:99px;background:#26305a}
  .st.win{background:#1e7a4a}.st.building{background:#7a5a1e}.st.judging{background:#4a3a8a}.st.lose{background:#7a2b2b}
  .gap{font-size:13px;opacity:.85;line-height:1.35}
  .rounds{font-size:12px;opacity:.6;margin-top:6px}
  .log{padding:0 28px 28px;font:12px/1.5 ui-monospace,monospace;opacity:.8;white-space:pre-wrap}
  a{color:#8fb3ff}
</style>
</head>
<body>
<header>
  <h1>STARWING</h1>
  <div class="meta" id="meta">loading…</div>
  <div class="meta"><a href="/" target="_blank">▶ play current build</a></div>
</header>
<main id="grid"></main>
<div class="log" id="log"></div>
<script>
async function tick(){
  try{
    const r = await fetch('/progress.json?'+Date.now()); const p = await r.json();
    const started = new Date(p.started);
    const el = (h)=>Math.floor(h/3600)+'h '+Math.floor(h%3600/60)+'m';
    document.getElementById('meta').textContent = `wave ${p.wave} · elapsed ${el((Date.now()-started)/1000)} · ${p.phase||''}`;
    const grid = document.getElementById('grid'); grid.innerHTML='';
    for (const [name,pc] of Object.entries(p.pieces)) {
      const c = document.createElement('div'); c.className='card';
      c.innerHTML = `<img src="/shots/${name}/${pc.shot||'t006.png'}?${p.updated}" onerror="this.style.opacity=.2">
        <div class="b"><h2>${name}<span class="st ${pc.status}">${pc.status}</span></h2>
        <div class="gap">${pc.verdict||''}${pc.gap?'<br><b>Biggest gap:</b> '+pc.gap:''}</div>
        <div class="rounds">round ${pc.round||0} · ${pc.wins||0} critic wins${pc.score!=null?' · score '+pc.score+'/10':''}</div></div>`;
      grid.appendChild(c);
    }
    document.getElementById('log').textContent = (p.log||[]).slice(-40).join('\n');
  }catch(e){ document.getElementById('meta').textContent='waiting for progress.json…'; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
