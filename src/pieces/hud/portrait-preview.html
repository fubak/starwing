<!doctype html>
<!-- dev preview: /src/pieces/hud/portrait-preview.html — all four portraits, large, mid-sentence -->
<html><body style="margin:0;background:#111;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:1264px">
<script type="module">
  import { createPortrait, CHARACTERS } from './portrait.js';
  const moods = { fox: 'calm', peppy: 'happy', falco: 'alarm', slippy: 'alarm' };
  const ps = Object.keys(CHARACTERS).map((id, i) => {
    const p = createPortrait(308, 2); p.setCharacter(id); p.setMood(moods[id]); p.setTalking(true);
    p.state.glitch = 0; p.state.pulse = 0;
    document.body.appendChild(p.canvas); return p;
  });
  window.__step = (dt) => { for (const p of ps) { p.update(dt); p.state.glitch = 0; p.state.pulse = 0; } };
  for (let i = 0; i < 40; i++) window.__step(1 / 60);
  // freeze mid-flap
  for (const p of ps) { p.state.mouth = 0.55; p.state.talking = false; p.state.blink = 0; p.update(0); }
  window.__ready = true;
</script>
</body></html>
